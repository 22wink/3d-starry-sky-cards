<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>3D 星空卡片</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <!-- 星空背景容器 -->
  <div id="starfield-container"></div>

  <!-- 3D Canvas 容器 -->
  <canvas id="canvas"></canvas>

  <!-- 卡片模态框 -->
  <div id="card-modal" class="modal hidden">
    <div class="modal-backdrop"></div>
    <div class="modal-content">
      <button id="close-btn" class="close-btn">
        <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <line x1="18" y1="6" x2="6" y2="18"></line>
          <line x1="6" y1="6" x2="18" y2="18"></line>
        </svg>
      </button>
      <div id="modal-card" class="modal-card">
        <div class="modal-image-container">
          <img id="modal-image" src="" alt="" />
        </div>
        <h3 id="modal-title" class="modal-title"></h3>
        <div class="modal-buttons">
          <button id="download-btn" class="btn-download">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
              <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
              <polyline points="7 10 12 15 17 10"></polyline>
              <line x1="12" y1="15" x2="12" y2="3"></line>
            </svg>
            <span>下载</span>
          </button>
          <button id="favorite-btn" class="btn-favorite">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
              <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"></path>
            </svg>
          </button>
        </div>
      </div>
    </div>
  </div>

  <!-- UI 覆盖层 -->
  <div class="ui-overlay">
    <h1 class="ui-title">3D 星空卡片</h1>
    <p class="ui-subtitle">拖动查看 • 滚动缩放 • 点击卡片查看详情</p>
  </div>

  <!-- Three.js 库 -->
  <script src="/public/three.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
